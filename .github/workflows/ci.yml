name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install lightweight deps
        run: pip install numpy opencv-python-headless fastapi httpx

      - name: Syntax check all source files
        run: python -m compileall -q src scripts

      - name: Run core smoke tests
        run: python scripts/ci_checks.py
